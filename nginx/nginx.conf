events {
    worker_connections 1024;
}

http {
    # Redirect HTTP to HTTPS (except ACME challenges)
    server {
        listen 80;
        server_name wpm.cash;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name wpm.cash;

        ssl_certificate /etc/letsencrypt/live/wpm.cash/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wpm.cash/privkey.pem;

        # Auth routes -> SvelteKit (better-auth)
        location /api/auth/ {
            proxy_pass http://wpm-web:4102/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authenticated trading routes -> SvelteKit proxy
        location /api/bet {
            proxy_pass http://wpm-web:4102/api/bet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/sell {
            proxy_pass http://wpm-web:4102/api/sell;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/balance {
            proxy_pass http://wpm-web:4102/api/balance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/positions {
            proxy_pass http://wpm-web:4102/api/positions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public API routes -> Effect.ts API
        location /api/ {
            proxy_pass http://wpm-api:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE — long-lived connections
        location /events/ {
            proxy_pass http://wpm-api:3000/events/;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Web app (SvelteKit)
        location / {
            proxy_pass http://wpm-web:4102/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
