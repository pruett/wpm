events {
    worker_connections 1024;
}

http {
    # Redirect HTTP -> HTTPS (except ACME challenges for cert renewal)
    server {
        listen 80;
        server_name wpm.cash;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name wpm.cash;

        ssl_certificate /etc/letsencrypt/live/wpm.cash/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wpm.cash/privkey.pem;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE stream (long-lived connection)
        location = /api/stream {
            proxy_pass http://wpm-web:4102;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Everything else -> Next.js
        location / {
            proxy_pass http://wpm-web:4102;
        }
    }
}
