server {
    listen 443 ssl;
    server_name wpm.example.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Auth routes → SvelteKit (better-auth)
    location /api/auth/ {
        proxy_pass http://wpm-web:4102/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Authenticated trading routes → SvelteKit proxy
    location /api/bet {
        proxy_pass http://wpm-web:4102/api/bet;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sell {
        proxy_pass http://wpm-web:4102/api/sell;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/balance {
        proxy_pass http://wpm-web:4102/api/balance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/positions {
        proxy_pass http://wpm-web:4102/api/positions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public API routes → Effect.ts API
    location /api/ {
        proxy_pass http://wpm-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE — long-lived connections
    location /events/ {
        proxy_pass http://wpm-api:3000/events/;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Web app (SvelteKit)
    location / {
        proxy_pass http://wpm-web:4102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name wpm.example.com;
    return 301 https://$host$request_uri;
}
