events {
    worker_connections 1024;
}

http {
    # Redirect HTTP -> HTTPS (except ACME challenges for cert renewal)
    server {
        listen 80;
        server_name wpm.cash;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name wpm.cash;

        ssl_certificate /etc/letsencrypt/live/wpm.cash/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wpm.cash/privkey.pem;

        # Default proxy headers (inherited by all locations unless overridden)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth + session-dependent routes -> SvelteKit
        location /api/auth/     { proxy_pass http://wpm-web:4102; }
        location = /api/bet     { proxy_pass http://wpm-web:4102; }
        location = /api/sell    { proxy_pass http://wpm-web:4102; }
        location = /api/balance { proxy_pass http://wpm-web:4102; }
        location = /api/positions { proxy_pass http://wpm-web:4102; }

        # Public API -> Effect.ts API (preserves /api/ prefix)
        location /api/ {
            proxy_pass http://wpm-api:3000;
        }

        # SSE streams (long-lived connections)
        location /events/ {
            proxy_pass http://wpm-api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # SvelteKit pages
        location / {
            proxy_pass http://wpm-web:4102;
        }
    }
}
