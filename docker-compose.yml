services:
  wpm-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-wpm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wpm}
      - POSTGRES_DB=${POSTGRES_DB:-wpm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpm} -d ${POSTGRES_DB:-wpm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - wpm-net

  wpm-web:
    image: ghcr.io/pruett/wpm-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      wpm-db:
        condition: service_healthy
    environment:
      - PORT=4102
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://${DOMAIN}
      - DATABASE_URL=postgres://${POSTGRES_USER:-wpm}:${POSTGRES_PASSWORD:-wpm}@wpm-db:5432/${POSTGRES_DB:-wpm}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - WPM_ORACLE_SERVICE_TOKEN=${WPM_ORACLE_SERVICE_TOKEN}
      - RP_ID=${DOMAIN}
      - ORIGIN=https://${DOMAIN}
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "const r = await fetch(''http://localhost:4102/api/oracle/health'', { headers: { Authorization: ''Bearer ${WPM_ORACLE_SERVICE_TOKEN}'' } }); if(!r.ok) process.exit(1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wpm-net

  wpm-oracle:
    image: ghcr.io/pruett/wpm-oracle:latest
    build:
      context: .
      dockerfile: packages/oracle/Dockerfile
    restart: unless-stopped
    depends_on:
      wpm-web:
        condition: service_healthy
    environment:
      - WEB_INTERNAL_URL=http://wpm-web:4102
      - WPM_ORACLE_SERVICE_TOKEN=${WPM_ORACLE_SERVICE_TOKEN}
      - TZ=${TZ:-America/New_York}
    networks:
      - wpm-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - wpm-web
    networks:
      - wpm-net

volumes:
  db-data:

networks:
  wpm-net:
    driver: bridge
