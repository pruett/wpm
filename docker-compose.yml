services:
  wpm2-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-wpm2}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wpm2}
      - POSTGRES_DB=${POSTGRES_DB:-wpm2}
    ports:
      # 5434: brew postgres holds 5432 and the old wpm project's containers hold 5432/5433
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpm2} -d ${POSTGRES_DB:-wpm2}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db-data:
