services:
  wpm-web:
    image: ghcr.io/pruett/wpm-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4102
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://${DOMAIN}
      - DATABASE_URL=/app/data/wpm.db
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - WPM_ORACLE_SERVICE_TOKEN=${WPM_ORACLE_SERVICE_TOKEN}
      - RP_ID=${DOMAIN}
      - ORIGIN=https://${DOMAIN}
      - NODE_ENV=production
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "const r = await fetch(''http://localhost:4102/api/oracle/health'', { headers: { Authorization: ''Bearer ${WPM_ORACLE_SERVICE_TOKEN}'' } }); if(!r.ok) process.exit(1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wpm-net

  wpm-oracle:
    image: ghcr.io/pruett/wpm-oracle:latest
    build:
      context: .
      dockerfile: packages/oracle/Dockerfile
    restart: unless-stopped
    depends_on:
      wpm-web:
        condition: service_healthy
    environment:
      - WEB_INTERNAL_URL=http://wpm-web:4102
      - WPM_ORACLE_SERVICE_TOKEN=${WPM_ORACLE_SERVICE_TOKEN}
      - TZ=${TZ:-America/New_York}
    networks:
      - wpm-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - wpm-web
    networks:
      - wpm-net

volumes:
  app-data:

networks:
  wpm-net:
    driver: bridge
