services:
  wpm-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-wpm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wpm}
      - POSTGRES_DB=${POSTGRES_DB:-wpm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpm} -d ${POSTGRES_DB:-wpm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  wpm-test-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_TEST_USER:-wpm}
      - POSTGRES_PASSWORD=${POSTGRES_TEST_PASSWORD:-wpm}
      - POSTGRES_DB=${POSTGRES_TEST_DB:-wpm_test}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-wpm} -d ${POSTGRES_TEST_DB:-wpm_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db-data:
  test-db-data:
