services:
  wpm-node:
    image: ghcr.io/pruett/wpm-node:latest
    build:
      context: .
      dockerfile: packages/node/Dockerfile
    restart: unless-stopped
    volumes:
      - chain-data:/app/data
      - keys:/app/data/keys
    environment:
      - NODE_PORT=4000
      - CHAIN_FILE=/app/data/chain.jsonl
      - KEYS_DIR=/app/data/keys
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "const r = await fetch(''http://localhost:4000/internal/health''); if(!r.ok) process.exit(1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wpm-net

  wpm-api:
    image: ghcr.io/pruett/wpm-api:latest
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      wpm-node:
        condition: service_healthy
    environment:
      - API_PORT=3000
      - NODE_URL=http://wpm-node:4000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "const r = await fetch(''http://localhost:3000/api/health''); if(!r.ok) process.exit(1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wpm-net

  wpm-oracle:
    image: ghcr.io/pruett/wpm-oracle:latest
    build:
      context: .
      dockerfile: packages/oracle/Dockerfile
    restart: unless-stopped
    depends_on:
      wpm-node:
        condition: service_healthy
    environment:
      - NODE_URL=http://wpm-node:4000
      - TZ=${TZ:-America/New_York}
    networks:
      - wpm-net

  wpm-web:
    image: ghcr.io/pruett/wpm-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      wpm-api:
        condition: service_healthy
    environment:
      - PORT=4102
      - WPM_API_URL=http://wpm-api:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://${DOMAIN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-WPM <noreply@wpm.cash>}
      - RP_ID=${DOMAIN}
      - ORIGIN=https://${DOMAIN}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - NODE_ENV=production
    volumes:
      - auth-data:/app/data
    networks:
      - wpm-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - wpm-web
    networks:
      - wpm-net

volumes:
  chain-data:
  keys:
  auth-data:

networks:
  wpm-net:
    driver: bridge
